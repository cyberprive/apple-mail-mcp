[project]
name = "apple-mail-mcp"
version = "0.2.0"
description = "Local MCP server for Apple Mail on macOS: read, search, draft and file email via AppleScript. Never sends."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The apple-mail-mcp authors" }]
keywords = ["mcp", "model-context-protocol", "apple-mail", "macos", "email", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
]
dependencies = [
    # mcp 2.x API (MCPServer). Tested on 2.0.0 through 2.3.0.
    # <3: the 1->2 major renamed FastMCP and broke fresh installs; review majors first.
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
apple-mail-mcp = "apple_mail_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_mail_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
